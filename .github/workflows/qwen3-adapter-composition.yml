name: Qwen3 exact neural adapter composition
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-adapter-composition.yml'
      - 'scripts/quality/qwen_adapter_composition.py'
      - 'scripts/quality/evaluate_qwen_adapter_composition.py'
      - 'scripts/tests/test_qwen_adapter_composition.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-adapter-composition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Verify real tensor and PEFT adapter composition
        run: |
          python -c 'import torch, peft, transformers'
          python -m unittest discover -s scripts/tests -p test_qwen_adapter_composition.py -v
      - name: Download original completed neural checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46049366258" | python -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]=="660c30a6ef0b87d0e1e11f7ff7a84ab4f576a2bc" and r["status"]=="completed" and r["conclusion"]=="failure" and r["path"].split("@")[0]==".github/workflows/qwen3-rationale-transfer.yml"'
          gh run download 46049366258 --repo "$GITHUB_REPOSITORY" --name qwen3-rationale-resume-checkpoints --dir recovered
      - name: Compare fixed blended and original trained weights
        timeout-minutes: 80
        run: |
          python scripts/quality/evaluate_qwen_adapter_composition.py evaluation/composition recovered
          python -c 'import json; r=json.load(open("evaluation/composition/report.json")); print(json.dumps({"baseline":r["baseline_summary"],"adapters":{k:v["summary"] for k,v in r["adapters"].items()},"paired":r["paired_blend_vs_sources"],"composition":r["composition"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-composed-neural-candidate
          path: |
            evaluation/composition/composition.json
            evaluation/composition/candidate/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: qwen3-adapter-composition-results
          path: evaluation/composition/report.json
          if-no-files-found: error
          retention-days: 14
