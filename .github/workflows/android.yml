name: Build Astra APK

# Heavy FULL/model download is reserved for PR validation, manual audits
# and weekly smoke checks. Main-branch delivery uses lite.yml instead.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

# Only the newest push to a PR needs to consume Android build capacity.
# Keep standard public runners; never introduce a paid large runner.
concurrency:
  group: astra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare native llama.cpp and bundled Qwen3 offline weights
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_android_sdk.sh
          python3 scripts/prepare_offline_android.py
      - name: Guard Astra navigation, offline AI, public-source attribution and build identity
        run: |
          python3 scripts/verify_ui_contract.py
          python3 scripts/verify_open_library.py

      - name: Verify private JNI logs and fail-closed patch tests
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
          python3 scripts/harden_native_inference.py --verify
          python3 scripts/fix_native_prompt_error.py --verify
          python3 scripts/fix_native_generation_budget.py --verify
          python3 scripts/fix_native_chat_continuity.py --verify
          python3 scripts/reduce_native_context_memory.py --verify

      - name: Run tests and build debug APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          else
            gradle --no-daemon testDebugUnitTest assembleDebug
          fi

      - name: Confirm APK contains real offline inference and model weights
        run: python3 scripts/verify_offline_apk.py

      - name: Check installed APK identity and label the downloadable APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -n "$aapt"
          package="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$package"
          [[ "$package" == *"name='com.astra.agent'"* ]] || {
            echo "Unexpected package ID in APK"; exit 1;
          }
          [[ "$package" == *"versionCode='28'"* ]] || {
            echo "Unexpected versionCode in APK"; exit 1;
          }
          [[ "$package" == *"versionName='0.12.1'"* ]] || {
            echo "Unexpected versionName in APK"; exit 1;
          }
          mkdir -p ../dist
          cp "$apk" "../dist/Astra-v0.12.1-FULL-offline-arm64-debug.apk"
          echo "Verified installable FULL APK identity: Astra v0.12.1 (28), offline ARM64"

      - name: Inspect debug APK composition
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from zipfile import ZipFile
          import os

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              raise SystemExit("Expected debug APK is missing: " + str(apk))

          total = apk.stat().st_size
          with ZipFile(apk) as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]

          groups = defaultdict(int)
          for entry in files:
              name = entry.filename
              if name.endswith(".dex"):
                  group = "DEX bytecode"
              elif name.startswith("lib/"):
                  group = "Native libraries"
              elif name.startswith(("res/", "resources.arsc")):
                  group = "Android resources"
              elif name.startswith("assets/"):
                  group = "Bundled assets"
              elif name.startswith("META-INF/"):
                  group = "Signing metadata"
              else:
                  group = "Manifest and other"
              groups[group] += entry.compress_size

          fmt = lambda n: f"{n / (1024 * 1024):.2f} MiB"
          lines = [
              "# Astra debug APK size analysis",
              "",
              f"APK: `{apk.name}`",
              f"APK file size: **{fmt(total)}** ({total:,} bytes)",
              "",
              "## Compressed size by category",
              "",
              "| Category | Size |",
              "| --- | ---: |",
          ]
          for group, size in sorted(groups.items(), key=lambda item: -item[1]):
              lines.append(f"| {group} | {fmt(size)} |")
          lines += [
              "",
              "## 15 largest entries in the APK",
              "",
              "| Entry | Compressed size |",
              "| --- | ---: |",
          ]
          for entry in sorted(files, key=lambda item: -item.compress_size)[:15]:
              lines.append(f"| `{entry.filename}` | {fmt(entry.compress_size)} |")

          lines += [
              "",
              "This is the **debug** build. Its size does not indicate whether",
              "Qwen3 weights and Android llama.cpp native inference libraries are", 
              "included and verified by the preceding CI step.",
              "",
          ]
          report = "\n".join(lines) + "\n"
          output = Path("app/build/reports/apk-size-report.md")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(report, encoding="utf-8")
          print(report)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(report)
          PY

      - name: Preserve full-build size report
        working-directory: android
        run: |
          mkdir -p ../dist
          cp app/build/reports/apk-size-report.md ../dist/FULL-size-report.md

      - name: Smoke test release signing with disposable CI-only key
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # This certificate is for validation ONLY and is never published.
          # Real owner release keys are not available in PR or debug builds.
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/astra-ci-test.jks" \
            -storetype PKCS12 \
            -storepass 'ci-ephemeral-test-password' \
            -keypass 'ci-ephemeral-test-password' \
            -alias 'astra-ci-test' \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Astra CI Test, O=Testing, C=US'
          export ASTRA_KEYSTORE_PATH="$RUNNER_TEMP/astra-ci-test.jks"
          export ASTRA_KEYSTORE_PASSWORD='ci-ephemeral-test-password'
          export ASTRA_KEY_ALIAS='astra-ci-test'
          export ASTRA_KEY_PASSWORD='ci-ephemeral-test-password'
          export ASTRA_RELEASE_VERSION_CODE=100001
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleRelease
          else
            gradle --no-daemon assembleRelease
          fi
          signed="app/build/outputs/apk/release/app-release.apk"
          test -s "$signed"
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$signer" verify "$signed"
          # Never distribute this throwaway-key release APK.
          rm -f "$signed" "$RUNNER_TEMP/astra-ci-test.jks"

      - name: Build lightweight APK without repackaging Qwen3 weights
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          # Keep the verified native runtime, but remove the GGUF asset.
          rm -f app/src/main/assets/qwen3-0.6b-q4km.gguf
          ASTRA_BUNDLE_MODEL=false gradle --no-daemon :app:clean :app:assembleDebug
          python3 ../scripts/verify_lite_apk.py app/build/outputs/apk/debug/app-debug.apk
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          package="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$package"
          [[ "$package" == *"name='com.astra.agent'"* &&
             "$package" == *"versionCode='28'"* &&
             "$package" == *"versionName='0.12.1'"* ]] || {
            echo "Lightweight APK identity mismatch"; exit 1;
          }
          cp "$apk" ../dist/Astra-v0.12.1-LITE-offline-arm64-debug.apk
          printf "# Lite APK\n\nSize: %s bytes\n\n" "$(wc -c < "$apk")" > ../dist/LITE-size-report.md
          echo "LITE APK ready; existing model can be imported from previous APK/ZIP."

      - name: Record LITE APK checksum and public signing fingerprint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk="../dist/Astra-v0.12.1-LITE-offline-arm64-debug.apk"
          test -s "$apk"
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify "$apk"
          # Android Build Tools versions vary in signer metadata wording.
          # Parse only a single signer #1 certificate SHA-256 digest, and
          # display the public metadata when validation cannot succeed.
          cert_output="$("$signer" verify --print-certs "$apk")"
          certificate="$(CERT_OUTPUT="$cert_output" python3 -c '
          import os, re, sys
          lines = os.environ["CERT_OUTPUT"].splitlines()
          patterns = (
              r"^Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)$",
              r"^V[1-4] Signer: certificate SHA-256 digest:\s*([0-9a-fA-F:]+)$",
          )
          matches = [m.group(1) for line in lines for pattern in patterns
                     if (m := re.fullmatch(pattern, line.strip()))]
          if len(matches) != 1:
              sys.exit("Expected one recognizable signer certificate; got " + str(len(matches)))
          digest = matches[0].replace(":", "").lower()
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              sys.exit("Invalid APK certificate fingerprint")
          print(digest)
          ')"
          # The debug certificate is runner-local and is NOT guaranteed to
          # match any previous Astra install. Never claim in-place compatibility.
          digest="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          {
            echo "Application ID: com.astra.agent"
            echo "Version: 0.12.1 (versionCode 28)"
            echo "Variant: LITE offline arm64 debug"
            echo "APK SHA-256: $digest"
            echo "Signer certificate SHA-256: $certificate"
            echo "Signing policy: ephemeral CI debug key; in-place updates require the same signer as the installed app."
            echo "Safety: do not uninstall or clear app data just to work around INSTALL_FAILED_UPDATE_INCOMPATIBLE."
          } > ../dist/LITE-signing-integrity-report.txt
          cat ../dist/LITE-signing-integrity-report.txt

      - name: Publish APK size analysis
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Astra-v0.12.1-Sizes
          retention-days: 7
          path: |
            dist/*-size-report.md
            dist/LITE-signing-integrity-report.txt
          if-no-files-found: error

      - name: Publish lightweight APK for low-data updates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Astra-v0.12.1-LITE-Offline-APK
          retention-days: 7
          path: dist/Astra-v0.12.1-LITE-offline-arm64-debug.apk
          if-no-files-found: error

      - name: Publish self-contained full APK (first installs only)
        # PR builds validate FULL but do not store large duplicate artifacts.
        # Main/owner-dispatched builds retain FULL for just one day to keep
        # artifact storage within free-tier budget as far as practical.
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Astra-v0.12.1-FULL-Offline-APK
          retention-days: 1
          path: dist/Astra-v0.12.1-FULL-offline-arm64-debug.apk
          if-no-files-found: error
