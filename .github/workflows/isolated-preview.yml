name: Build isolated Astra Preview LITE APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-isolated-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Parallel-install offline QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare native llama.cpp without downloading model weights
        run: |
          set -euo pipefail
          bash scripts/install_android_sdk.sh
          python3 scripts/prepare_offline_android.py --lite
          python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
          python3 scripts/verify_ui_contract.py
          python3 scripts/harden_native_inference.py --verify
          python3 scripts/fix_native_prompt_error.py --verify
          python3 scripts/fix_native_generation_budget.py --verify
          python3 scripts/fix_native_chat_continuity.py --verify
          python3 scripts/reduce_native_context_memory.py --verify

      - name: Build tests and separate package
        working-directory: android
        env:
          ASTRA_BUNDLE_MODEL: 'false'
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest :app:assemblePreview
          python3 ../scripts/verify_lite_apk.py app/build/outputs/apk/preview/app-preview.apk

      - name: Verify preview package cannot overwrite original Astra
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/preview/app-preview.apk"
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$signer"
          "$signer" verify "$apk"
          identity="$("$aapt" dump badging "$apk")"
          printf '%s\n' "$identity" | grep -m 1 "^package:"
          printf '%s\n' "$identity" | grep -m 1 "^application-label:"
          [[ "$identity" == *"name='com.astra.agent.preview'"* ]] || {
            echo "::error::Preview identity must be com.astra.agent.preview"; exit 1;
          }
          [[ "$identity" == *"versionName='0.12.1-preview'"* ]] || {
            echo "::error::Preview version suffix absent"; exit 1;
          }
          [[ "$identity" == *"application-label:'Astra Preview'"* ]] || {
            echo "::error::Preview must show a distinct launcher label"; exit 1;
          }
          mkdir -p dist
          cp "$apk" dist/Astra-v0.12.1-PREVIEW-LITE-arm64.apk
          sha256sum dist/Astra-v0.12.1-PREVIEW-LITE-arm64.apk             > dist/Astra-v0.12.1-PREVIEW-LITE-arm64.apk.sha256
          echo "Verified isolated preview identity, APK signature, no bundled model and distinct label."

      - name: Upload only the small test APK
        uses: actions/upload-artifact@v4
        with:
          name: Astra-v0.12.1-PREVIEW-LITE-USB-test
          path: |
            dist/Astra-v0.12.1-PREVIEW-LITE-arm64.apk
            dist/Astra-v0.12.1-PREVIEW-LITE-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
