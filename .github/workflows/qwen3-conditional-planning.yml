name: Actual Qwen3 conditional calculator planning
on:
  pull_request:
    branches: [main, intelligence/acie-conditional-calculator-planning]
    paths:
      - '.github/workflows/qwen3-conditional-planning.yml'
      - 'scripts/quality/run_qwen_conditional_planning.py'
      - 'scripts/tests/test_qwen_conditional_planning.py'
      - 'scripts/quality/AcieCalculatorProbe.kt'
      - 'scripts/quality/run_qwen_calculator_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-conditional-planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify evaluator contracts and compile actual production Kotlin parser
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p test_qwen_conditional_planning.py -v
          command -v kotlinc
          mkdir -p evaluation
          src=android/app/src/main/java/com/astra/agent
          kotlinc "$src/AstraCalculationAssist.kt" "$src/AstraInterruptedReply.kt" scripts/quality/AcieCalculatorProbe.kt -include-runtime -d evaluation/calculator-bridge.jar
      - name: Check compiled selective retry gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/quality python - <<'PY'
          from pathlib import Path
          from run_qwen_calculator_probe import bridge
          jar=Path("evaluation/calculator-bridge.jar")
          q="There are 12 items costing 5 each. What is the cost? Reply only with the number."
          assert bridge(jar,"retry_gate",q,"CALC: 12*6") is True
          for question,proposal in [(q,"NONE"),(q,"Answer: 60"),
              ("Add 2,50 and 7. Reply only with the number.","CALC: 2+7"),
              ("A shop buys 12 items. What is its cost? Reply only with the number.","CALC: 12*12"),
              ("A shop buys 12 items costing 5 coins each. What is its cost?","CALC: 12*6")]:
              assert bridge(jar,"retry_gate",question,proposal) is False
          PY
      - name: Obtain pinned public model and native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Measure conditional planning retry gains and unsuitable acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/run_qwen_conditional_planning.py cpu-build/bin/llama-server evaluation/calculator-bridge.jar --seed 95172643 --selective > evaluation/conditional-planning.json
          cat evaluation/conditional-planning.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-conditional-planning-results
          path: evaluation/conditional-planning.json
          if-no-files-found: error
          retention-days: 14
