name: Actual Qwen3 calculator-assisted reasoning
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-calculator-evaluation.yml'
      - 'scripts/quality/run_qwen_calculator_probe.py'
      - 'scripts/quality/AcieCalculatorProbe.kt'
      - 'android/app/src/main/java/com/astra/agent/AstraCalculationAssist.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-calculator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify evaluator contracts and compile actual production Kotlin parser
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p test_qwen_calculator_probe.py -v
          command -v kotlinc
          mkdir -p evaluation
          src=android/app/src/main/java/com/astra/agent
          kotlinc "$src/AstraCalculationAssist.kt" "$src/AstraInterruptedReply.kt" scripts/quality/AcieCalculatorProbe.kt -include-runtime -d evaluation/calculator-bridge.jar
          mkdir -p evaluation/baseline
          baseline=4f0f41b65e5590cdc3f93c700ad006447965fdf3
          for name in AstraCalculationAssist AstraInterruptedReply; do
            git show "$baseline:$src/$name.kt" > "evaluation/baseline/$name.kt"
          done
          kotlinc evaluation/baseline/*.kt scripts/quality/AcieCalculatorProbe.kt -include-runtime -d evaluation/baseline-calculator-bridge.jar
      - name: Obtain pinned public model and native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Evaluate actual model plans with production calculator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/run_qwen_calculator_probe.py cpu-build/bin/llama-server evaluation/calculator-bridge.jar > evaluation/calculator-results.json
          cat evaluation/calculator-results.json >> "$GITHUB_STEP_SUMMARY"
          python scripts/quality/run_qwen_calculator_probe.py cpu-build/bin/llama-server evaluation/calculator-bridge.jar --fresh --paired > evaluation/calculator-paired-results.json
          cat evaluation/calculator-paired-results.json >> "$GITHUB_STEP_SUMMARY"
          python scripts/quality/run_qwen_calculator_probe.py cpu-build/bin/llama-server evaluation/calculator-bridge.jar --rational --paired --baseline-bridge evaluation/baseline-calculator-bridge.jar > evaluation/calculator-rational-results.json
          python -c 'import json,pathlib; p=pathlib.Path("evaluation/calculator-rational-results.json"); d=json.loads(p.read_text()); d["baseline_commit"]="4f0f41b65e5590cdc3f93c700ad006447965fdf3"; p.write_text(json.dumps(d,indent=2)+"\n")'
          cat evaluation/calculator-rational-results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-calculator-cpu-results
          path: |
            evaluation/calculator-results.json
            evaluation/calculator-paired-results.json
            evaluation/calculator-rational-results.json
          if-no-files-found: error
          retention-days: 14
