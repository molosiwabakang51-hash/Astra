name: Qwen3 1.7B neural adaptation pilot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-neural-adaptation.yml'
      - 'scripts/quality/qwen_neural_curriculum.py'
      - 'scripts/quality/train_qwen_neural_pilot.py'
      - 'scripts/tests/test_qwen_neural_pilot.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-neural-adaptation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate curriculum and paired evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_neural_pilot.py -v
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Verify actual tensor loss and checkpoint contracts
        run: |
          python -c 'import torch'
          python -m unittest discover -s scripts/tests -p test_qwen_neural_pilot.py -v
      - name: Train low-rank weights and compare baseline with adapter
        timeout-minutes: 50
        run: |
          set -euo pipefail
          python scripts/quality/train_qwen_neural_pilot.py evaluation/neural-pilot --steps 4 --dtype float32
          cat evaluation/neural-pilot/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-neural-partial-checkpoints
          path: evaluation/neural-pilot/partial/step-*/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: qwen3-neural-adaptation-pilot
          path: |
            evaluation/neural-pilot/report.json
            evaluation/neural-pilot/adapter/
          if-no-files-found: error
          retention-days: 14
