name: Actual Qwen3 1.7B CPU profile comparison
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-profile-evaluation.yml'
      - 'scripts/quality/run_qwen_profile_comparison.py'
      - 'scripts/quality/AcieAnswerContractProbe.kt'
      - 'android/app/src/main/java/com/astra/agent/AstraAnswerContract.kt'
      - 'scripts/quality/AcieContextRecoveryProbe.kt'
      - 'android/app/src/main/java/com/astra/agent/AstraConversationContext.kt'
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite
        required: true
        type: choice
        default: quantitative_check
        options:
          - quantitative_check
          - context_recovery
          - historical
permissions:
  contents: read
concurrency:
  group: astra-qwen-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_profile_comparison.py -v
      - name: Compile production answer contract for formatting-only audit
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          mkdir -p evaluation
          src=android/app/src/main/java/com/astra/agent
          kotlinc "$src/AstraAnswerContract.kt" "$src/AstraInterruptedReply.kt" scripts/quality/AcieAnswerContractProbe.kt -include-runtime -d evaluation/answer-contract.jar
      - name: Compile baseline and revised production recovery builders
        if: github.event_name == 'pull_request' || inputs.suite == 'context_recovery'
        shell: bash
        run: |
          set -euo pipefail
          src=android/app/src/main/java/com/astra/agent
          baseline=014fa7dc2364ce9cb2cdbf3942f22e6a11e7d548
          mkdir -p evaluation/baseline
          for name in AstraConversationContext AstraOfflinePolicy AstraReasoningMode AstraUnicodeBounds; do
            git show "$baseline:$src/$name.kt" > "evaluation/baseline/$name.kt"
          done
          kotlinc evaluation/baseline/*.kt scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/baseline-context.jar
          kotlinc "$src/AstraConversationContext.kt" "$src/AstraOfflinePolicy.kt" "$src/AstraReasoningMode.kt" "$src/AstraUnicodeBounds.kt" scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/candidate-context.jar
      - name: Obtain exact public 1.7B model and pinned native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare quantitative reasoning and verification
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'quantitative_check'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_profile_comparison.py cpu-build/bin/llama-server --experiment quantitative_check --seed 50792163 --answer-contract-jar evaluation/answer-contract.jar > evaluation/quantitative-comparison.json
          cat evaluation/quantitative-comparison.json >> "$GITHUB_STEP_SUMMARY"
      - name: Compare restored context with identical model and reasoning profile
        if: github.event_name == 'pull_request' || inputs.suite == 'context_recovery'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/run_qwen_profile_comparison.py cpu-build/bin/llama-server --experiment context_recovery --seed 71108263 --baseline-context-jar evaluation/baseline-context.jar --candidate-context-jar evaluation/candidate-context.jar > evaluation/context-recovery-comparison.json
          cat evaluation/context-recovery-comparison.json >> "$GITHUB_STEP_SUMMARY"
      - name: Reproduce historical model comparisons
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'historical'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_profile_comparison.py cpu-build/bin/llama-server --experiment breadth --seed 147806239 > evaluation/breadth-comparison.json
          python scripts/quality/run_qwen_profile_comparison.py cpu-build/bin/llama-server --experiment authority --seed 69173217 > evaluation/authority-comparison.json
          cat evaluation/breadth-comparison.json evaluation/authority-comparison.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-native-cpu-comparison
          path: evaluation/*-comparison.json
          if-no-files-found: error
          retention-days: 14
