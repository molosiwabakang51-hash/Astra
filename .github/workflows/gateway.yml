name: Test Astra Gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway security and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run dependency-free gateway tests
        working-directory: gateway
        run: npm test
