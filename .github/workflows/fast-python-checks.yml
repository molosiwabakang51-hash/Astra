name: Fast Astra Python regression checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-fast-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python regression suite (no model download)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify Python script syntax
        run: python -m compileall -q scripts

      - name: Run regression suite
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
