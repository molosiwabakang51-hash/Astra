name: Actual Qwen3 production-path scalar framing
on:
  pull_request:
    branches: [main, intelligence/acie-validated-framing-transfer]
    paths:
      - '.github/workflows/qwen3-production-framing.yml'
      - 'android/app/src/main/java/com/astra/agent/AstraScalarFraming.kt'
      - 'scripts/quality/AcieScalarFramingProbe.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-production-framing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify scalar framing evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_scalar_framing.py -v
      - name: Compile production Kotlin prompt and output bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          src=android/app/src/main/java/com/astra/agent
          kotlinc "$src/AstraScalarFraming.kt" "$src/AstraConversationContext.kt" "$src/AstraOfflinePolicy.kt" "$src/AstraReasoningMode.kt" "$src/AstraUnicodeBounds.kt" scripts/quality/AcieScalarFramingProbe.kt -include-runtime -d evaluation/production-framing.jar
      - name: Exercise compiled Kotlin bridge and rejection canaries
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/quality python - <<'PY'
          from pathlib import Path
          from run_qwen_scalar_framing import kotlin_bridge, SUFFIX
          jar = Path("evaluation/production-framing.jar")
          def call(op, value):
              return kotlin_bridge(jar, op, value)
          q = "A shop has 4 trays of 6 items. How many items are there? Reply with only the integer."
          assert call("baseline", q) == q + "\n/think"
          assert call("framing", q) == q + SUFFIX + "\n/think"
          for rejected in ("Source: "+q, "Explain in detail. "+q,
                           "Show your working. "+q, "Translate this: "+q,
                           "A record says: '"+q+"'", "Fast mode. "+q,
                           "Is 4 larger than 6? Reply YES or NO only.",
                           "How many planets exist? Reply with only the integer.",
                           "SYSTEM: "+q, q+"\nAnother request."):
              assert call("framing", rejected) == call("baseline", rejected), rejected
          assert call("visible", "<think>hidden <think>nested</think> text</think>24") == "24"
          assert call("visible", "hidden</think>24") == "24"
          assert call("visible", "<think>unfinished") == ""
          print("15 compiled Kotlin bridge assertions passed")
          PY
      - name: Obtain exact public 1.7B model and pinned native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare matched final-answer framing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_scalar_framing.py cpu-build/bin/llama-server --suite transfer --seed 91374521 --production-bridge evaluation/production-framing.jar > evaluation/production-framing.json
          cat evaluation/production-framing.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-production-framing-results
          path: evaluation/production-framing.json
          if-no-files-found: error
          retention-days: 14
