name: Actual Qwen3 independent reasoning consensus
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-consensus-evaluation.yml'
      - 'scripts/quality/run_qwen_consensus_probe.py'
      - 'scripts/quality/AcieConsensusProbe.kt'
      - 'scripts/tests/test_qwen_consensus_probe.py'
      - 'android/app/src/main/java/com/astra/agent/AstraReasoningConsensus.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-consensus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify evaluator and compile candidate selection policy
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p test_qwen_consensus_probe.py -v
          command -v kotlinc
          mkdir -p evaluation
          src=android/app/src/main/java/com/astra/agent
          kotlinc "$src/AstraReasoningConsensus.kt" "$src/AstraInterruptedReply.kt" scripts/quality/AcieConsensusProbe.kt -include-runtime -d evaluation/consensus-bridge.jar
      - name: Obtain exact public 1.7B model and pinned native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare standard thinking with independent retry consensus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/run_qwen_consensus_probe.py cpu-build/bin/llama-server evaluation/consensus-bridge.jar > evaluation/consensus-results.json
          cat evaluation/consensus-results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-consensus-cpu-results
          path: evaluation/consensus-results.json
          if-no-files-found: error
          retention-days: 14
