name: Qwen3 projected neural update
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-projected-update.yml'
      - 'scripts/quality/qwen_contrastive_curriculum.py'
      - 'scripts/quality/qwen_calibration_loss.py'
      - 'scripts/quality/qwen_neural_resume.py'
      - 'scripts/quality/train_qwen_projected_update.py'
      - 'scripts/quality/qwen_retention_anchor.py'
      - 'scripts/quality/qwen_projection_anchors.py'
      - 'scripts/quality/qwen_projected_update.py'
      - 'scripts/tests/test_qwen_projected_update.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-projected-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Verify curriculum and actual tensor gradients
        run: |
          python -c 'import torch'
          python -m unittest discover -s scripts/tests -p test_qwen_projected_update.py -v
      - name: Train ordinary and projected AdamW adapters
        timeout-minutes: 50
        run: |
          set -euo pipefail
          python scripts/quality/train_qwen_projected_update.py evaluation/projection
          cat evaluation/projection/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-projection-resume-checkpoints
          path: evaluation/projection/resume/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: qwen3-projected-update-results
          path: |
            evaluation/projection/report.json
            evaluation/projection/ordinary/
            evaluation/projection/projected/
          if-no-files-found: error
          retention-days: 14
