name: Actual Qwen3 scalar answer framing
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-scalar-framing.yml'
      - 'scripts/quality/run_qwen_scalar_framing.py'
      - 'scripts/tests/test_qwen_scalar_framing.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-scalar-framing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify scalar framing evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_scalar_framing.py -v
      - name: Obtain exact public 1.7B model and pinned native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare matched final-answer framing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_scalar_framing.py cpu-build/bin/llama-server --seed 79218431 > evaluation/scalar-framing.json
          cat evaluation/scalar-framing.json >> "$GITHUB_STEP_SUMMARY"
          python scripts/quality/run_qwen_scalar_framing.py cpu-build/bin/llama-server --suite transfer --seed 91374521 > evaluation/scalar-framing-transfer.json
          cat evaluation/scalar-framing-transfer.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-scalar-framing-results
          path: |
            evaluation/scalar-framing.json
            evaluation/scalar-framing-transfer.json
          if-no-files-found: error
          retention-days: 14
