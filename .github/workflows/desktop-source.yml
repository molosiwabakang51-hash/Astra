name: Build Astra Desktop source distribution
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/tests/test_desktop_distribution.py'
      - '.github/workflows/desktop-source.yml'
      - 'scripts/tests/test_workflow_runtime_policy.py'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'scripts/tests/test_desktop_distribution.py'
      - 'scripts/tests/test_workflow_runtime_policy.py'
      - '.github/workflows/desktop-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run distribution regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_desktop_distribution.py' -v
      - name: Build and verify archive
        run: |
          python desktop/astra_desktop_distribution.py build AstraDesktop.zip
          python desktop/astra_desktop_distribution.py verify AstraDesktop.zip
      - name: Extract and inspect
        shell: pwsh
        run: |
          Expand-Archive AstraDesktop.zip -DestinationPath extracted
          Push-Location extracted/AstraDesktop
          python -E -s astra_launcher.py --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -E -s -c "import tkinter; import astra_workbench; import astra_launcher"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@v6
        with:
          name: AstraDesktop-source
          path: AstraDesktop.zip
          if-no-files-found: error
          retention-days: 7

  windows-frozen:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pyinstaller==6.22.3
      - name: Run frozen packaging regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_desktop_frozen.py' -v
      - name: Build unsigned executable and run functional smoke checks
        run: python desktop/astra_frozen_build.py frozen-dist
      - name: Verify bundle and repeat executable smoke checks
        shell: pwsh
        run: |
          python -c "import sys,json; sys.path.insert(0,'desktop'); from astra_frozen_build import verify; assert verify('frozen-dist/AstraDesktop',json.load(open('frozen-dist/MANIFEST.json',encoding='utf-8')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\frozen-dist\AstraDesktop\AstraDesktop.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\frozen-dist\AstraDesktop\AstraDesktop.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: AstraDesktop-frozen-unsigned-x64
          path: frozen-dist/
          if-no-files-found: error
          retention-days: 7
