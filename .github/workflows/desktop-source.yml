name: Build Astra Desktop distribution
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/tests/test_desktop*.py'
      - '.github/workflows/desktop-source.yml'
      - 'scripts/tests/test_workflow_runtime_policy.py'
  push:
    branches:
      - main
      - feat/desktop-frozen-integrated
    paths:
      - 'desktop/**'
      - 'scripts/tests/test_desktop*.py'
      - '.github/workflows/desktop-source.yml'
      - 'scripts/tests/test_workflow_runtime_policy.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run desktop regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_desktop*.py' -v
      - name: Build source archive
        run: python desktop/astra_desktop_distribution.py build AstraDesktop.zip
      - name: Verify source archive
        run: python desktop/astra_desktop_distribution.py verify AstraDesktop.zip
      - uses: actions/upload-artifact@v6
        with:
          name: AstraDesktop-source
          path: AstraDesktop.zip
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pyinstaller==6.22.3
      - name: Build and verify relocated frozen application
        run: python desktop/astra_frozen_build.py frozen-dist
      - uses: actions/upload-artifact@v6
        with:
          name: AstraDesktop-frozen-unsigned-x64
          path: frozen-dist/
          if-no-files-found: error
          retention-days: 7
