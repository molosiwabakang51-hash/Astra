name: Qwen3 answer-weighted budget recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-weighted-budget-recovery.yml'
      - 'scripts/quality/qwen_weighted_budget.py'
      - 'scripts/quality/evaluate_qwen_weighted_budget.py'
      - 'scripts/tests/test_qwen_weighted_budget.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-weighted-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test pinned evidence and trajectory boundaries
        run: python -m unittest discover -s scripts/tests -p test_qwen_weighted_budget.py -v
      - name: Install pinned tensor dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Recover pinned trained adapters and completed report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46144851739" | python -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]=="9198837de622a179e5603a4f135a83a900b6ce8c" and r["status"]=="completed" and r["conclusion"]=="success"'
          gh run download 46144851739 --repo "$GITHUB_REPOSITORY" --name qwen3-answer-weighted-trained --dir trained
          gh run download 46144851739 --repo "$GITHUB_REPOSITORY" --name qwen3-answer-weighted-results --dir archive
      - name: Evaluate actual pretrained and trained models at long cap
        timeout-minutes: 85
        run: |
          python scripts/quality/evaluate_qwen_weighted_budget.py evaluation/weighted-budget trained archive
          python -c 'import json; r=json.load(open("evaluation/weighted-budget/report.json")); print(json.dumps({"baseline":r["baseline"]["long_summary"],"adapters":{k:v["long_summary"] for k,v in r["adapters"].items()},"paired":r["paired_weighted_vs_ordinary"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-weighted-budget-results
          path: evaluation/weighted-budget/report.json
          if-no-files-found: error
          retention-days: 14
