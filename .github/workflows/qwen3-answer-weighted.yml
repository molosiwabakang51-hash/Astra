name: Qwen3 answer-weighted reasoning
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-answer-weighted.yml'
      - 'scripts/quality/qwen_answer_weighted.py'
      - 'scripts/quality/train_qwen_answer_weighted.py'
      - 'scripts/tests/test_qwen_answer_weighted.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-answer-weighted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU tensor dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Verify independent curriculum oracles and real weighted tensor loss
        run: |
          python -c 'import torch, safetensors, numpy'
          python -m unittest discover -s scripts/tests -p test_qwen_answer_weighted.py -v
      - name: Train and evaluate matched answer-weighted adapters
        timeout-minutes: 80
        run: |
          python scripts/quality/train_qwen_answer_weighted.py evaluation/answer-weighted
          python -c 'import json; r=json.load(open("evaluation/answer-weighted/report.json")); print(json.dumps({"baseline":r["baseline_summary"],"adapters":{k:v["summary"] for k,v in r["adapters"].items()},"paired":r["paired_weighted_vs_ordinary"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-answer-weighted-checkpoints
          path: evaluation/answer-weighted/resume/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-answer-weighted-trained
          path: |
            evaluation/answer-weighted/training.json
            evaluation/answer-weighted/ordinary/
            evaluation/answer-weighted/weighted/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: qwen3-answer-weighted-results
          path: evaluation/answer-weighted/report.json
          if-no-files-found: error
          retention-days: 14
