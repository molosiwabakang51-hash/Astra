name: Qwen3 fixed neural delta attenuation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-neural-delta-attenuation.yml'
      - 'scripts/quality/qwen_neural_attenuation.py'
      - 'scripts/quality/evaluate_qwen_neural_attenuation.py'
      - 'scripts/tests/test_qwen_neural_attenuation.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-delta-attenuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Verify exact delta and actual PEFT forward contracts
        run: |
          python -c "import torch, peft"
          python -m unittest discover -s scripts/tests -p test_qwen_neural_attenuation.py -v
      - name: Download pinned completed neural checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46049366258" | python -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]=="660c30a6ef0b87d0e1e11f7ff7a84ab4f576a2bc" and r["status"]=="completed" and r["conclusion"]=="failure" and r["path"].split("@")[0]==".github/workflows/qwen3-rationale-transfer.yml"'
          gh run download 46049366258 --repo "$GITHUB_REPOSITORY" --name qwen3-rationale-resume-checkpoints --dir recovered
      - name: Evaluate actual frozen and adapted models on matched reasoning prompts
        timeout-minutes: 60
        run: |
          python scripts/quality/evaluate_qwen_neural_attenuation.py evaluation/delta-attenuation recovered
          python -c 'import json; r=json.load(open("evaluation/delta-attenuation/report.json")); print(json.dumps({"baseline":r["baseline_summary"],"adapters":{k:v["summary"] for k,v in r["adapters"].items()},"paired":r["paired_half_vs_full"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen3-neural-attenuation-candidate
          path: |
            evaluation/delta-attenuation/candidate/
            evaluation/delta-attenuation/intervention.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-neural-attenuation-results
          path: evaluation/delta-attenuation/report.json
          if-no-files-found: error
          retention-days: 14
