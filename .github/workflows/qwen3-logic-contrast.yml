name: Actual Qwen3 logic-contrast comprehension
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-logic-contrast.yml'
      - 'scripts/quality/run_qwen_logic_contrast.py'
      - 'scripts/tests/test_qwen_logic_contrast.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-logic-contrast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate pairing and evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_logic_contrast.py -v
      - name: Compile pinned production logical verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          git show 46de3fa0af463f79087f963894ab82f3387aadd6:android/app/src/main/java/com/astra/agent/AstraPropositionalVerifier.kt > evaluation/AstraPropositionalVerifier.kt
          kotlinc evaluation/AstraPropositionalVerifier.kt scripts/quality/AcieLogicProbe.kt -include-runtime -d evaluation/logic-bridge.jar
      - name: Obtain pinned model and native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare matched logic-contrast reasoning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_logic_contrast.py cpu-build/bin/llama-server evaluation/logic-bridge.jar > evaluation/logic-contrast.json
          cat evaluation/logic-contrast.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-logic-contrast-results
          path: evaluation/logic-contrast.json
          if-no-files-found: error
          retention-days: 14
