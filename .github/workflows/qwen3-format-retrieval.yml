name: Actual Qwen3 format-retrieval comprehension
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-format-retrieval.yml'
      - 'scripts/quality/run_qwen_format_retrieval.py'
      - 'scripts/tests/test_qwen_format_retrieval.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-format-retrieval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate pairing and evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_format_retrieval.py -v
      - name: Compile exact pre/post production context builders
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          src=android/app/src/main/java/com/astra/agent
          mkdir -p evaluation/baseline evaluation/candidate
          for name in AstraConversationContext AstraOfflinePolicy AstraReasoningMode AstraUnicodeBounds; do
            git show "a971f45532f36771de4c5c022e051463ed38218c:$src/$name.kt" > "evaluation/baseline/$name.kt"
            git show "d355f2cc543230e424283696aad4d1aae27b2b66:$src/$name.kt" > "evaluation/candidate/$name.kt"
          done
          kotlinc evaluation/baseline/*.kt scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/baseline-context.jar
          kotlinc evaluation/candidate/*.kt scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/candidate-context.jar
      - name: Obtain pinned model and native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare matched format-retrieval reasoning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_format_retrieval.py cpu-build/bin/llama-server --baseline-context-jar evaluation/baseline-context.jar --candidate-context-jar evaluation/candidate-context.jar > evaluation/format-retrieval.json
          cat evaluation/format-retrieval.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-format-retrieval-results
          path: evaluation/format-retrieval.json
          if-no-files-found: error
          retention-days: 14
