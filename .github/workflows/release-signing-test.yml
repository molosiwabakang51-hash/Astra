name: Test Astra release signing configuration

# Uses an ephemeral throwaway keystore. Never loads owner secrets.
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - '.github/workflows/owner-release.yml'
      - '.github/workflows/release-signing-test.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - '.github/workflows/owner-release.yml'
      - '.github/workflows/release-signing-test.yml'

permissions:
  contents: read

jobs:
  signing-test:
    name: Assemble and verify with an ephemeral CI key
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create throwaway signing key and verify release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          export ASTRA_SIGNING_STORE_FILE="$RUNNER_TEMP/astra-ci-throwaway.jks"
          export ASTRA_SIGNING_STORE_PASSWORD="ci-only-do-not-use-for-real-apps"
          export ASTRA_SIGNING_KEY_ALIAS="astra-ci"
          export ASTRA_SIGNING_KEY_PASSWORD="ci-only-do-not-use-for-real-apps"
          trap 'rm -f "$ASTRA_SIGNING_STORE_FILE"' EXIT
          keytool -genkeypair -noprompt \
            -keystore "$ASTRA_SIGNING_STORE_FILE" \
            -storetype PKCS12 \
            -alias "$ASTRA_SIGNING_KEY_ALIAS" \
            -storepass "$ASTRA_SIGNING_STORE_PASSWORD" \
            -keypass "$ASTRA_SIGNING_KEY_PASSWORD" \
            -dname "CN=Astra CI,O=Astra Testing" \
            -keyalg RSA -keysize 2048 -validity 1
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon testDebugUnitTest assembleRelease
          else
            gradle --no-daemon testDebugUnitTest assembleRelease
          fi
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
