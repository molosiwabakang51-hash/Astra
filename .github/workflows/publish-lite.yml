name: Publish owner-signed Astra Lite APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version corresponding to the current source"
        required: true
        default: "v0.11.0"

permissions:
  contents: write

concurrency:
  group: astra-signed-release
  cancel-in-progress: false

jobs:
  signed-lite:
    name: Publish persistent low-data Android update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Verify release version and prevent overwrites
        env:
          RELEASE_TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v0.11.0" || {
            echo "Requested release version does not match compiled app."; exit 1;
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release with that version already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare ARM64 model engine without downloading GGUF
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "ndk;29.0.13113456" "cmake;3.31.6"
          python3 scripts/prepare_offline_android.py --lite

      - name: Load owner's signing key from GitHub Actions Secrets
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASTRA_KEYSTORE_BASE64" || {
            echo "Set ASTRA_KEYSTORE_BASE64 and the three other signing secrets."
            exit 1
          }
          printf '%s' "$ASTRA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/astra-owner.jks"
          chmod 600 "$RUNNER_TEMP/astra-owner.jks"
          test -s "$RUNNER_TEMP/astra-owner.jks"

      - name: Build and verify signed small APK
        shell: bash
        env:
          ASTRA_BUNDLE_MODEL: 'false'
          ASTRA_KEYSTORE_PATH: ${{ runner.temp }}/astra-owner.jks
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ASTRA_KEYSTORE_PASSWORD"
          test -n "$ASTRA_KEY_ALIAS"
          test -n "$ASTRA_KEY_PASSWORD"
          python3 scripts/verify_ui_contract.py
          cd android
          gradle --no-daemon testDebugUnitTest assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          python3 ../scripts/verify_lite_apk.py "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          package="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$package"
          [[ "$package" == *"name='com.astra.agent'"* &&
             "$package" == *"versionCode='17'"* &&
             "$package" == *"versionName='0.11.0'"* ]] || exit 1
          mkdir -p ../dist
          cp "$apk" ../dist/Astra-v0.11.0-LITE-arm64-SIGNED.apk

      - name: Publish persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/Astra-v0.11.0-LITE-arm64-SIGNED.apk \
            --target "$GITHUB_SHA" \
            --title "Astra v0.11.0 - Small offline update" \
            --notes "Owner-signed lightweight ARM64 APK. Import Qwen3 Q4_K_M model ONCE from the GGUF, a previously downloaded Astra APK, or its GitHub ZIP. Inference then runs on the Android phone without internet. Keep the model document backed up. For seamless future updates the previous app must share the same owner signing certificate. Back up existing Astra data before migrating from an old debug build."

      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/astra-owner.jks"
