name: Qwen3 rationale generation budget
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-rationale-budget.yml'
      - 'scripts/tests/test_qwen_rationale_budget.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-rationale-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify budget contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_rationale_budget.py -v
      - name: Install pinned CPU tensor dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install transformers==4.52.4 peft==0.15.2 accelerate==1.7.0 huggingface-hub==0.32.4 safetensors==0.5.3 numpy==2.2.6
          python -m pip check
      - name: Download original completed training checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46049366258" | python -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]=="660c30a6ef0b87d0e1e11f7ff7a84ab4f576a2bc" and r["status"]=="completed" and r["conclusion"]=="failure" and r["path"].split("@")[0]==".github/workflows/qwen3-rationale-transfer.yml"'
          gh run download 46049366258 --repo "$GITHUB_REPOSITORY" --name qwen3-rationale-resume-checkpoints --dir recovered
      - name: Compare actual 96 and 256 token trajectories
        timeout-minutes: 65
        run: |
          python scripts/quality/evaluate_qwen_rationale_checkpoints.py evaluation/budget recovered --budget-probe
          python -c 'import json; r=json.load(open("evaluation/budget/report.json")); print(json.dumps({k:{a:v[a] for a in ("short_summary","long_summary","paired","prefix_reproduced")} for k,v in {"baseline":r["baseline"],**r["adapters"]}.items()},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-rationale-budget-results
          path: evaluation/budget/report.json
          if-no-files-found: error
          retention-days: 14
