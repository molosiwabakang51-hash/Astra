name: Actual Qwen3 quantity dependency recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen3-quantity-dependencies.yml'
      - 'scripts/quality/run_qwen_quantity_dependencies.py'
      - 'scripts/tests/test_qwen_quantity_dependencies.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-qwen-quantity-dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate pairing and evaluation contracts
        run: python -m unittest discover -s scripts/tests -p test_qwen_quantity_dependencies.py -v
      - name: Compile exact pre/post production context builders
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          src=android/app/src/main/java/com/astra/agent
          git cat-file -e 9000823fd56ceded8090c398690c006aef6f55b1^{commit} || git fetch origin 9000823fd56ceded8090c398690c006aef6f55b1
          mkdir -p evaluation/baseline evaluation/candidate
          for name in AstraConversationContext AstraOfflinePolicy AstraReasoningMode AstraUnicodeBounds; do
            git show "4319ea3d27b6f953e65d2481ca76386e403509ff:$src/$name.kt" > "evaluation/baseline/$name.kt"
            git show "9000823fd56ceded8090c398690c006aef6f55b1:$src/$name.kt" > "evaluation/candidate/$name.kt"
          done
          kotlinc evaluation/baseline/*.kt scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/baseline-context.jar
          kotlinc evaluation/candidate/*.kt scripts/quality/AcieContextRecoveryProbe.kt -include-runtime -d evaluation/candidate-context.jar
      - name: Obtain pinned model and native source
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; sys.path.insert(0, "scripts"); from prepare_offline_android import prepare_model; prepare_model()'
          git clone --depth 1 --branch b12248 https://github.com/ggml-org/llama.cpp.git cpu-llama
          [[ "$(git -C cpu-llama rev-parse HEAD)" == 3837bf0* ]]
      - name: Compile native CPU inference server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cpu-llama -B cpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DGGML_CUDA=OFF
          cmake --build cpu-build --target llama-server --parallel 4
      - name: Compare matched quantity dependency recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          python scripts/quality/run_qwen_quantity_dependencies.py cpu-build/bin/llama-server --baseline-context-jar evaluation/baseline-context.jar --candidate-context-jar evaluation/candidate-context.jar > evaluation/quantity-dependencies.json
          cat evaluation/quantity-dependencies.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: qwen3-quantity-dependencies-results
          path: evaluation/quantity-dependencies.json
          if-no-files-found: error
          retention-days: 14
